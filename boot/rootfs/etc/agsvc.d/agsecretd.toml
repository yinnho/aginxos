# agsecretd (M36) — the secret sidecar: every boundary credential in one
# daemon, served over /run/aginx/secret.sock (SO_PEERCRED + exe
# allowlist in /etc/aginx/secret.policy). DECISIONS §9, SYSTEM.md §7.1.
# Foreign to nobody: our own binary, but it speaks no notify protocol
# and serves a socket, not a supervisor channel — type = simple.
# Carrier consumers retry on connect failure (boot ordering is
# race-tolerant, like everything on this device).
[unit]
name = agsecretd

[service]
cmd = /usr/bin/agsecretd
type = simple
