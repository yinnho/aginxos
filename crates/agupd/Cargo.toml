[package]
name = "agupd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
# M26: manifest signature gate lives in the agsign lib (one key, one
# chain — shared with agpkg). Verify-only there; the phone never signs.
agsign = { path = "../agsign" }

[[bin]]
name = "agupd"
path = "src/main.rs"
