[package]
name = "agdl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AginxOS HTTPS downloader — minimal static fetch for the package installer"
publish = false

[[bin]]
name = "agdl"
path = "src/main.rs"

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
