[package]
name = "agdone"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# agdone (M27) — provision 的 done 标记纪律。一次性引导步骤只有
# 成功才留痕：失败不写标记、下次开机自然重试；坏标记（非常规文件）
# 当不存在。态落 /var/lib/ag/done/<name>，随 agupd state tar 存活换机。
# AGDONE_DIR env override 供测试与 adb 开发环。
[dependencies]
serde_json.workspace = true
agio = { path = "../agio" }

[[bin]]
name = "agdone"
path = "src/main.rs"

[dev-dependencies]
testkit = { path = "../testkit" }
