[package]
name = "agentos"
version = "0.1.0"
edition = "2021"
description = "An Agent Harness Operating System"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID for IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
reedline = "0.4"
nu-ansi-term = "0.50"

# LLM
async-openai = "0.24"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Errors
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
