[workspace]
resolver = "2"
members = [
    "crates/ag",
    "crates/agio",
    "crates/agimg",
    "crates/aginxos-probe",
    "crates/aginxos-agent",
    "crates/aginxos-init",
    "crates/agdl",
    "crates/agsign",
    "crates/agsvc",
    "crates/agpkg",
    "crates/agdone",
    "crates/agsecret",
    "crates/agupd",
    "crates/aterm",
    "crates/wifi-wizard",
    "crates/testkit",
]
default-members = ["crates/aginxos-probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yinnho/aginxos"
authors = ["yinnho"]

[workspace.dependencies]
libc = "0.2"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
strip = true
panic = "abort"
